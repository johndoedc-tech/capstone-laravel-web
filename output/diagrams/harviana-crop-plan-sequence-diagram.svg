<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1470" viewBox="0 0 1900 1470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#263238"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#173b2c}.subtitle{font:18px Arial,sans-serif;fill:#54635c}.head{font:700 19px Arial,sans-serif;fill:#18352a}.msg{font:17px Arial,sans-serif;fill:#263238}.small{font:15px Arial,sans-serif;fill:#455a64}.phase{font:700 18px Arial,sans-serif;fill:#315846}
      .life{stroke:#789187;stroke-width:2;stroke-dasharray:9 8}.call{stroke:#263238;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.return{stroke:#52665d;stroke-width:2.1;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1900" height="1420" fill="#fff"/>
  <text x="950" y="54" text-anchor="middle" class="title">Harviana Crop Plan and Production Estimate Sequence Diagram</text>
  <text x="950" y="84" text-anchor="middle" class="subtitle">Farmer planning, machine-learning estimation, and crop-plan storage</text>

  <g>
    <rect x="45" y="120" width="190" height="72" rx="10" fill="#e8f5e9" stroke="#3f7d58" stroke-width="2"/><text x="140" y="163" text-anchor="middle" class="head">Farmer</text>
    <rect x="300" y="120" width="210" height="72" rx="10" fill="#e3f2fd" stroke="#4179a5" stroke-width="2"/><text x="405" y="163" text-anchor="middle" class="head">Web Browser</text>
    <rect x="575" y="120" width="285" height="72" rx="10" fill="#eef7ee" stroke="#4c8b5f" stroke-width="2"/><text x="718" y="152" text-anchor="middle" class="head">FarmerCalendar</text><text x="718" y="176" text-anchor="middle" class="head">Controller</text>
    <rect x="930" y="120" width="270" height="72" rx="10" fill="#f3e5f5" stroke="#7e57a1" stroke-width="2"/><text x="1065" y="152" text-anchor="middle" class="head">CropPrediction</text><text x="1065" y="176" text-anchor="middle" class="head">Service</text>
    <rect x="1270" y="120" width="245" height="72" rx="10" fill="#ede7f6" stroke="#6c5aa7" stroke-width="2"/><text x="1393" y="152" text-anchor="middle" class="head">Connected ML</text><text x="1393" y="176" text-anchor="middle" class="head">Service</text>
    <rect x="1590" y="120" width="260" height="72" rx="10" fill="#fff3e0" stroke="#b27624" stroke-width="2"/><text x="1720" y="152" text-anchor="middle" class="head">Railway</text><text x="1720" y="176" text-anchor="middle" class="head">PostgreSQL</text>
  </g>
  <line x1="140" y1="192" x2="140" y2="1340" class="life"/><line x1="405" y1="192" x2="405" y2="1340" class="life"/><line x1="718" y1="192" x2="718" y2="1340" class="life"/><line x1="1065" y1="192" x2="1065" y2="1340" class="life"/><line x1="1393" y1="192" x2="1393" y2="1340" class="life"/><line x1="1720" y1="192" x2="1720" y2="1340" class="life"/>

  <rect x="25" y="230" width="1850" height="720" rx="8" fill="#f8fbf9" stroke="#afc1b8" stroke-width="2"/><text x="55" y="262" class="phase">Production estimation</text>
  <line x1="140" y1="315" x2="405" y2="315" class="call"/><text x="273" y="302" text-anchor="middle" class="msg">1. Enter crop plan details</text>
  <line x1="405" y1="390" x2="718" y2="390" class="call"/><text x="562" y="377" text-anchor="middle" class="msg">2. Request production estimate</text><text x="562" y="400" text-anchor="middle" class="small">POST production-prediction</text>
  <path d="M718 455 h105 v58 h-105" class="call"/><text x="835" y="476" class="msg">3. Validate inputs and</text><text x="835" y="500" class="msg">estimate harvest date</text>
  <line x1="718" y1="565" x2="1065" y2="565" class="call"/><text x="892" y="552" text-anchor="middle" class="msg">4. Predict crop-plan production</text>
  <line x1="1065" y1="640" x2="1393" y2="640" class="call"/><text x="1229" y="627" text-anchor="middle" class="msg">5. Send crop, area, date,</text><text x="1229" y="651" text-anchor="middle" class="small">municipality, and farm type</text>
  <line x1="1393" y1="725" x2="1065" y2="725" class="return"/><text x="1229" y="712" text-anchor="middle" class="msg">6. Return estimate and confidence</text>
  <line x1="1065" y1="800" x2="718" y2="800" class="return"/><text x="892" y="787" text-anchor="middle" class="msg">7. Return normalized prediction</text>
  <line x1="718" y1="865" x2="405" y2="865" class="return"/><text x="562" y="852" text-anchor="middle" class="msg">8. Return estimate and harvest date</text>
  <line x1="405" y1="925" x2="140" y2="925" class="return"/><text x="273" y="912" text-anchor="middle" class="msg">9. Display planning result</text>

  <rect x="25" y="975" width="1850" height="410" rx="8" fill="#fffdf7" stroke="#d3bd8a" stroke-width="2"/><text x="55" y="1007" class="phase">Crop-plan storage</text>
  <line x1="140" y1="1060" x2="405" y2="1060" class="call"/><text x="273" y="1047" text-anchor="middle" class="msg">10. Confirm and save plan</text>
  <line x1="405" y1="1125" x2="718" y2="1125" class="call"/><text x="562" y="1112" text-anchor="middle" class="msg">11. Submit calendar event</text>
  <line x1="718" y1="1190" x2="1720" y2="1190" class="call"/><text x="1219" y="1177" text-anchor="middle" class="msg">12. Store crop plan, prediction, and estimated harvest</text>
  <line x1="1720" y1="1250" x2="718" y2="1250" class="return"/><text x="1219" y="1237" text-anchor="middle" class="msg">13. Return saved event</text>
  <line x1="718" y1="1305" x2="405" y2="1305" class="return"/><text x="562" y="1292" text-anchor="middle" class="msg">14. Return success response</text>
  <line x1="405" y1="1355" x2="140" y2="1355" class="return"/><text x="273" y="1342" text-anchor="middle" class="msg">15. Show calendar entry</text>
</svg>
