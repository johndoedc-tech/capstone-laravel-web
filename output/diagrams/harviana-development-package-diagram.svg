<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#42564d"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#173b2c}.subtitle{font:18px Arial,sans-serif;fill:#54635c}
      .pkgTitle{font:700 21px Arial,sans-serif;fill:#173b2c}.stereo{font:italic 15px Arial,sans-serif;fill:#557066}.item{font:17px Arial,sans-serif;fill:#263238}.small{font:15px Arial,sans-serif;fill:#455a64}.edgeLabel{font:700 15px Arial,sans-serif;fill:#42564d}
      .dep{stroke:#42564d;stroke-width:2.4;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1380" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">Harviana Development View Package Diagram</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">Laravel application modules and their software dependencies</text>

  <!-- Presentation package -->
  <g>
    <path d="M520 120 H735 V150 H1280 V295 H520 Z" fill="#e3f2fd" stroke="#4179a5" stroke-width="2.5"/>
    <text x="545" y="143" class="stereo">&lt;&lt;package&gt;&gt;</text>
    <text x="900" y="181" text-anchor="middle" class="pkgTitle">Presentation Layer</text>
    <text x="900" y="215" text-anchor="middle" class="item">Farmer Blade Views</text>
    <text x="900" y="242" text-anchor="middle" class="item">LGU Validator Blade Views</text>
    <text x="900" y="269" text-anchor="middle" class="item">DA Administrator Views and JavaScript Components</text>
  </g>

  <!-- Routing package -->
  <g>
    <path d="M560 350 H755 V380 H1240 V525 H560 Z" fill="#e8f5e9" stroke="#3f7d58" stroke-width="2.5"/>
    <text x="585" y="373" class="stereo">&lt;&lt;package&gt;&gt;</text>
    <text x="900" y="411" text-anchor="middle" class="pkgTitle">Routing and Access Control</text>
    <text x="900" y="445" text-anchor="middle" class="item">web.php, api.php, and auth.php</text>
    <text x="900" y="474" text-anchor="middle" class="item">Authentication, Role, Admin, LGU, and Password Middleware</text>
    <text x="900" y="502" text-anchor="middle" class="small">Directs authorized requests to the appropriate controllers</text>
  </g>

  <!-- Controllers package -->
  <g>
    <path d="M300 590 H520 V620 H1500 V830 H300 Z" fill="#eef7ee" stroke="#4c8b5f" stroke-width="2.5"/>
    <text x="325" y="613" class="stereo">&lt;&lt;package&gt;&gt;</text>
    <text x="900" y="652" text-anchor="middle" class="pkgTitle">Application Controllers</text>
    <text x="520" y="700" text-anchor="middle" class="item">Authentication and Profile Controllers</text>
    <text x="520" y="732" text-anchor="middle" class="item">FarmerDashboardController</text>
    <text x="520" y="764" text-anchor="middle" class="item">FarmerCalendarController</text>
    <text x="1280" y="700" text-anchor="middle" class="item">LguValidationController</text>
    <text x="1280" y="732" text-anchor="middle" class="item">MapController and MapDataController</text>
    <text x="1280" y="764" text-anchor="middle" class="item">ReportController and UserController</text>
    <text x="900" y="806" text-anchor="middle" class="small">Coordinates user requests, validation, responses, and module access</text>
  </g>

  <!-- Services package -->
  <g>
    <path d="M90 900 H310 V930 H825 V1185 H90 Z" fill="#f3e5f5" stroke="#7e57a1" stroke-width="2.5"/>
    <text x="115" y="923" class="stereo">&lt;&lt;package&gt;&gt;</text>
    <text x="458" y="964" text-anchor="middle" class="pkgTitle">Domain Services</text>
    <text x="458" y="1002" text-anchor="middle" class="item">CropPredictionService</text>
    <text x="458" y="1033" text-anchor="middle" class="item">MunicipalSupplyForecastService</text>
    <text x="458" y="1064" text-anchor="middle" class="item">EventAuthenticityService</text>
    <text x="458" y="1095" text-anchor="middle" class="item">CommunityCropSignalService</text>
    <text x="458" y="1126" text-anchor="middle" class="item">WeatherService and GeminiChatService</text>
    <text x="458" y="1157" text-anchor="middle" class="item">UserActivityFeedService</text>
  </g>

  <!-- Models package -->
  <g>
    <path d="M975 900 H1195 V930 H1710 V1185 H975 Z" fill="#fff3e0" stroke="#b27624" stroke-width="2.5"/>
    <text x="1000" y="923" class="stereo">&lt;&lt;package&gt;&gt;</text>
    <text x="1343" y="964" text-anchor="middle" class="pkgTitle">Data Models and Persistence</text>
    <text x="1343" y="1002" text-anchor="middle" class="item">User</text>
    <text x="1343" y="1033" text-anchor="middle" class="item">FarmerCalendarEvent and CalendarEventAudit</text>
    <text x="1343" y="1064" text-anchor="middle" class="item">Prediction and CropProduction</text>
    <text x="1343" y="1095" text-anchor="middle" class="item">AdminActivityLog</text>
    <text x="1343" y="1126" text-anchor="middle" class="item">ForumPost, ForumComment, ForumVote, and ForumCategory</text>
    <text x="1343" y="1157" text-anchor="middle" class="small">Eloquent models, relationships, casts, and database queries</text>
  </g>

  <!-- External services package -->
  <g>
    <path d="M90 1240 H290 V1270 H755 V1350 H90 Z" fill="#ede7f6" stroke="#6c5aa7" stroke-width="2.5"/>
    <text x="115" y="1263" class="stereo">&lt;&lt;external package&gt;&gt;</text>
    <text x="423" y="1300" text-anchor="middle" class="pkgTitle">Connected External Services</text>
    <text x="423" y="1330" text-anchor="middle" class="item">ML Prediction API, Weather API, Gemini API, and Google OAuth</text>
  </g>

  <!-- Database package -->
  <g>
    <path d="M1045 1240 H1245 V1270 H1710 V1350 H1045 Z" fill="#fff7e8" stroke="#b27624" stroke-width="2.5"/>
    <text x="1070" y="1263" class="stereo">&lt;&lt;database package&gt;&gt;</text>
    <text x="1378" y="1302" text-anchor="middle" class="pkgTitle">Railway PostgreSQL</text>
    <text x="1378" y="1331" text-anchor="middle" class="item">Harviana application data and records</text>
  </g>

  <!-- Dependencies -->
  <line x1="900" y1="295" x2="900" y2="350" class="dep"/>
  <rect x="825" y="309" width="150" height="25" rx="12" fill="#ffffff"/><text x="900" y="327" text-anchor="middle" class="edgeLabel">HTTP requests</text>

  <line x1="900" y1="525" x2="900" y2="590" class="dep"/>
  <rect x="840" y="540" width="120" height="25" rx="12" fill="#ffffff"/><text x="900" y="558" text-anchor="middle" class="edgeLabel">dispatches</text>

  <path d="M720 830 C670 860 610 875 560 900" class="dep"/>
  <rect x="578" y="850" width="90" height="25" rx="12" fill="#ffffff"/><text x="623" y="868" text-anchor="middle" class="edgeLabel">uses</text>

  <path d="M1080 830 C1130 860 1190 875 1240 900" class="dep"/>
  <rect x="1132" y="850" width="120" height="25" rx="12" fill="#ffffff"/><text x="1192" y="868" text-anchor="middle" class="edgeLabel">reads/writes</text>

  <line x1="825" y1="1045" x2="975" y2="1045" class="dep"/>
  <rect x="842" y="1016" width="116" height="25" rx="12" fill="#ffffff"/><text x="900" y="1034" text-anchor="middle" class="edgeLabel">uses models</text>

  <path d="M420 1185 C420 1205 420 1220 420 1240" class="dep"/>
  <rect x="360" y="1197" width="120" height="25" rx="12" fill="#ffffff"/><text x="420" y="1215" text-anchor="middle" class="edgeLabel">API calls</text>

  <path d="M1378 1185 C1378 1205 1378 1220 1378 1240" class="dep"/>
  <rect x="1318" y="1197" width="120" height="25" rx="12" fill="#ffffff"/><text x="1378" y="1215" text-anchor="middle" class="edgeLabel">Eloquent/SQL</text>
</svg>
